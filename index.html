<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطبخي الإلكتروني - Matbakhi Online</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #fdfbf7; color: #333; line-height: 1.6; direction: rtl; text-align: right; }
        
        header { background: #ffffff; padding: 12px 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-container { display: flex; align-items: center; gap: 10px; }
        .logo-container img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; border: 2px solid #ff6b6b; }
        .logo-container h1 { font-size: 1rem; color: #2c3e50; }
        nav a { text-decoration: none; color: #555; margin-right: 12px; font-weight: 600; font-size: 0.9rem; }
        nav a:hover { color: #ff6b6b; }

        .slider { width: 100%; height: 200px; overflow: hidden; background: #ddd; }
        .slider img { width: 100%; height: 100%; object-fit: cover; }

        .container { max-width: 1000px; margin: 15px auto; padding: 0 10px; }
        .section-title { text-align: center; margin-bottom: 15px; color: #2c3e50; font-size: 1.3rem; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 160px; object-fit: cover; }
        .product-info { padding: 12px; text-align: center; }
        .product-info h3 { font-size: 1rem; margin-bottom: 5px; color: #333; }
        .product-info .price { color: #ff6b6b; font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
        .btn-buy { display: inline-block; background: #27ae60; color: #fff; padding: 6px 15px; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 0.9rem; }

        /* لوحة التحكم منظمة ومبسطة للهاتف */
        .admin-panel { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; margin: 25px auto; border-radius: 8px; }
        .admin-panel h3 { margin-bottom: 12px; color: #f57c00; font-size: 1.1rem; text-align: center; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #444; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; background: #fff; direction: ltr; text-align: left; }
        .form-group input.ar-text { direction: rtl; text-align: right; }
        .btn-upload { background: #007bff; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 0.95rem; margin-top: 5px; }
        .btn-upload:hover { background: #0056b3; }
        #status-msg { margin-top: 10px; font-weight: bold; text-align: center; font-size: 0.9rem; }

        footer { background: #2c3e50; color: #fff; text-align: center; padding: 15px; margin-top: 30px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img id="header-logo" src="images/logo.png" alt="شعار">
            <h1>مطبخي الإلكتروني</h1>
        </div>
        <nav>
            <a href="#">الرئيسية</a>
            <a href="#admin">إدارة الصور</a>
        </nav>
    </header>

    <div class="slider">
        <img id="header-slider" src="images/slider1.jpg" alt="سلايدر">
    </div>

    <div class="container">
        <h2 class="section-title">أحدث منتجات المطبخ والأواني</h2>
        <div class="products-grid">
            <div class="product-card">
                <img src="images/product1.jpg" alt="منتج">
                <div class="product-info">
                    <h3>أداة مطبخ عصرية</h3>
                    <div class="price">150 درهم</div>
                    <a href="#" class="btn-buy">طلب المنتج</a>
                </div>
            </div>
            <div class="product-card">
                <img src="images/product2.jpg" alt="منتج">
                <div class="product-info">
                    <h3>طقم أواني فاخر</h3>
                    <div class="price">250 درهم</div>
                    <a href="#" class="btn-buy">طلب المنتج</a>
                </div>
            </div>
        </div>

        <!-- لوحة التحكم -->
        <div class="admin-panel" id="admin">
            <h3>لوحة رفع الصور أوتوماتيكياً لـ GitHub</h3>
            
            <div class="form-group">
                <label>GitHub Personal Access Token (التوكن):</label>
                <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxx">
            </div>

            <div class="form-group">
                <label>مسار الصورة واسمها (مثال: images/product3.jpg):</label>
                <input type="text" id="file-path" class="ar-text" placeholder="images/product3.jpg">
            </div>

            <div class="form-group">
                <label>اختر الصورة من الاستوديو:</label>
                <input type="file" id="file-input" accept="image/*" style="direction: rtl;">
            </div>

            <button class="btn-upload" onclick="uploadImageToGitHub()">رفع الصورة إلى GitHub الآن</button>
            <div id="status-msg"></div>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - مطبخي الإلكتروني - Matbakhi Online</p>
    </footer>

    <script>
        const owner = "brico2web-spec";
        const repo = "Dar";
        const branch = "main";

        function uploadImageToGitHub() {
            const token = document.getElementById('gh-token').value.trim();
            const path = document.getElementById('file-path').value.trim();
            const fileInput = document.getElementById('file-input');
            const statusMsg = document.getElementById('status-msg');

            if (!token || !path || fileInput.files.length === 0) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "المرجو ملء جميع الخانات واختيار صورة صحيحة!";
                return;
            }

            const file = fileInput.files[0];
            statusMsg.style.color = "orange";
            statusMsg.innerText = "جاري رفع الصورة أوتوماتيكياً لـ GitHub...";

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function () {
                const base64Content = reader.result.split(',')[1];
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

                fetch(apiUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                })
                .then(response => response.json().then(data => ({ status: response.status, data })))
                .then(obj => {
                    let sha = null;
                    if (obj.status === 200 && obj.data.sha) {
                        sha = obj.data.sha;
                    }

                    const bodyData = {
                        message: `Upload image ${path} via Matbakhi Online`,
                        content: base64Content,
                        branch: branch
                    };
                    if (sha) { bodyData.sha = sha; }

                    return fetch(apiUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Content-Type': 'application/json',
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify(bodyData)
                    });
                })
                .then(res => {
                    if (res.ok) {
                        statusMsg.style.color = "green";
                        statusMsg.innerText = "تم رفع الصورة بنجاح إلى GitHub!";
                    } else {
                        return res.json().then(err => { throw new Error(err.message || "فشل الرفع"); });
                    }
                })
                .catch(error => {
                    statusMsg.style.color = "red";
                    statusMsg.innerText = "خطأ في الرفع: تأكد من صحة التوكن واسم المسار.";
                });
            };
        }
    </script>
</body>
</html>
